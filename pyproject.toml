[project]
name = "ai-minesweeper-solver"
version = "0.1.0"
description = "Intelligent Minesweeper Solver for Intro to AI"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
minesweeper = "minesweeper.cli:main"

[project.gui-scripts]
minesweeper-gui = "minesweeper_gui.app:main"

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
